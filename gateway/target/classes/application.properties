spring.application.name=gateway
server.port=${GATEWAY_PORT:8080}
jwt.secret=${JWT_SECRET:mi_clave_secreta_super_segura_para_jwt_32_bytes}

spring.cloud.gateway.server.webflux.routes[0].id=autentificador
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTENTIFICADOR_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=producto-catalogo
spring.cloud.gateway.server.webflux.routes[1].uri=${PRODUCTO_CATALOGO_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/productos/**

spring.cloud.gateway.server.webflux.routes[2].id=pedido-ordenes
spring.cloud.gateway.server.webflux.routes[2].uri=${PEDIDO_ORDENES_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/pedidos/**

spring.cloud.gateway.server.webflux.routes[3].id=pago
spring.cloud.gateway.server.webflux.routes[3].uri=${PAGO_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/pagos/**
